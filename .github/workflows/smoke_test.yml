name: Smoke Test Fleet

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  SCRIPT_BUCKET: 387385940921-devops-scripts

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout banking app repo
        uses: actions/checkout@v4
        with:
          repository: divaychauhan/banking-app-2-tier
          ref: main

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::387385940921:role/github-action-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload smoke_test.py to S3
        run: |
          aws s3 mb s3://${SCRIPT_BUCKET} --region ${AWS_REGION} 2>/dev/null || true

          aws s3 cp smoke_test.py s3://${SCRIPT_BUCKET}/smoke_test.py \
            --region ${AWS_REGION}

      - name: Run Smoke Test on Fleet
        id: smoke
        run: |
          cat > ssm-commands.json <<EOF
          {
            "commands": [
              "aws s3 cp s3://${SCRIPT_BUCKET}/smoke_test.py /tmp/smoke_test.py --region ${AWS_REGION}",
              "python3 -m pip install --user boto3 pymysql -q",
              "python3 /tmp/smoke_test.py",
              "rm -f /tmp/smoke_test.py"
            ]
          }
          EOF

          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:App,Values=flask" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-commands.json \
            --query "Command.CommandId" \
            --output text \
            --region ${AWS_REGION})

          echo "cmd_id=$CMD_ID" >> $GITHUB_OUTPUT
          echo "SSM Command ID: $CMD_ID"

      - name: Wait and Show Results
        run: |
          CMD_ID="${{ steps.smoke.outputs.cmd_id }}"

          echo "Waiting for SSM command to finish..."

          for i in {1..30}; do
            STATUS_LIST=$(aws ssm list-command-invocations \
              --command-id "$CMD_ID" \
              --query "CommandInvocations[].Status" \
              --output text \
              --region ${AWS_REGION})

            echo "Current status: $STATUS_LIST"

            if echo "$STATUS_LIST" | grep -q "InProgress\|Pending\|Delayed"; then
              sleep 10
            else
              break
            fi
          done

          echo "------ FULL SSM RESULT ------"

          aws ssm list-command-invocations \
            --command-id "$CMD_ID" \
            --details \
            --region ${AWS_REGION} \
            --output text

          FAILED=$(aws ssm list-command-invocations \
            --command-id "$CMD_ID" \
            --query "length(CommandInvocations[?Status!='Success'])" \
            --output text \
            --region ${AWS_REGION})

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Smoke test failed on $FAILED instance(s)!"
            exit 1
          fi

          echo "✅ Smoke Test Passed ✅✅🤦"
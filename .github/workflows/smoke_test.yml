name: Smoke Test Fleet

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Banking App Repo
        uses: actions/checkout@v4
        with:
          repository: divaychauhan/banking-app-2-tier
          ref: main

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::387385940921:role/github-action-deploy-role
          aws-region: us-east-1

      - name: Upload init and smoke files to S3
        run: |
          aws s3 mb s3://387385940921-devops-scripts --region us-east-1 2>/dev/null || true

          aws s3 cp init.py s3://387385940921-devops-scripts/init.py --region us-east-1
          aws s3 cp init.sql s3://387385940921-devops-scripts/init.sql --region us-east-1
          aws s3 cp smoke_test.py s3://387385940921-devops-scripts/smoke_test.py --region us-east-1

      - name: Create Database and Tables
        id: initdb
        run: |
          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:App,Values=flask" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "set -e",
              "aws s3 cp s3://387385940921-devops-scripts/init.py /tmp/init.py --region us-east-1",
              "aws s3 cp s3://387385940921-devops-scripts/init.sql /tmp/init.sql --region us-east-1",
              "apt-get update -y",
              "apt-get install -y python3 python3-pip python3-pymysql python3-boto3",
              "python3 /tmp/init.py",
              "rm -f /tmp/init.py /tmp/init.sql"
            ]}' \
            --query "Command.CommandId" \
            --output text \
            --region us-east-1)

          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Show Database Init Result
        run: |
          sleep 30

          aws ssm list-command-invocations \
            --command-id "${{ steps.initdb.outputs.cmd_id }}" \
            --details \
            --region us-east-1 \
            --output text

          FAILED=$(aws ssm list-command-invocations \
            --command-id "${{ steps.initdb.outputs.cmd_id }}" \
            --query "length(CommandInvocations[?Status=='Failed'])" \
            --output text \
            --region us-east-1)

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Database init failed on $FAILED instance(s)!"
            exit 1
          fi

          echo "✅ Database initialized successfully"

      - name: Run Smoke Test on Fleet
        id: smoke
        run: |
          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:App,Values=flask" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "set -e",
              "aws s3 cp s3://387385940921-devops-scripts/smoke_test.py /tmp/smoke_test.py --region us-east-1",
              "apt-get update -y",
              "apt-get install -y python3 python3-pip python3-pymysql python3-boto3",
              "python3 /tmp/smoke_test.py",
              "rm -f /tmp/smoke_test.py"
            ]}' \
            --query "Command.CommandId" \
            --output text \
            --region us-east-1)

          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Show Smoke Test Results
        run: |
          sleep 30

          aws ssm list-command-invocations \
            --command-id "${{ steps.smoke.outputs.cmd_id }}" \
            --details \
            --region us-east-1 \
            --output text

          FAILED=$(aws ssm list-command-invocations \
            --command-id "${{ steps.smoke.outputs.cmd_id }}" \
            --query "length(CommandInvocations[?Status=='Failed'])" \
            --output text \
            --region us-east-1)

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Smoke test failed on $FAILED instance(s)!"
            exit 1
          fi

          echo "✅ Smoke Test Passed"

      - name: Build and Push Image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ env.VERSION }} .
          docker push ${{ env.IMAGE }}:${{ env.VERSION }}
          echo "Image Pushed : ${{ env.VERSION }} ✅"

      - name: Upload Docker-Compose to S3
        run: |
          aws s3 cp docker-compose.yml ${{ env.S3_BUCKET }}/docker-compose.yml --region ${{ env.REGION }}
          echo "Docker compose Uploaded ✅"